name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-pack:
    name: Test, build, and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build app and library
        run: pnpm build

      - name: Pack npm tarball
        run: pnpm pack

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: mainlander-*.tgz
          if-no-files-found: error
